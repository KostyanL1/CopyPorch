name: Checkstyle and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run Checkstyle
        run: bash gradlew --no-daemon checkstyleMain checkstyleTest

      - name: Build project
        run: bash gradlew --no-daemon build
